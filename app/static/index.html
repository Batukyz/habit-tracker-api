<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Habit Tracker</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --border: #2a2e38;
    --text: #e8eaed;
    --muted: #9aa1ac;
    --accent: #6c8cff;
    --accent-hover: #85a1ff;
    --danger: #ff6b6b;
    --success: #4ade80;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 32px 20px 80px; }
  h1 { font-size: 22px; margin: 0 0 24px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
  }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  input {
    width: 100%;
    padding: 10px 12px;
    background: #0f1115;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
    margin-bottom: 14px;
  }
  input:focus { outline: none; border-color: var(--accent); }
  button {
    cursor: pointer;
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 600;
  }
  .btn-primary { background: var(--accent); color: #fff; width: 100%; }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-ghost { background: transparent; color: var(--muted); font-weight: 400; font-size: 13px; }
  .btn-ghost:hover { color: var(--text); }
  .btn-small { padding: 6px 10px; font-size: 13px; }
  .btn-check { background: var(--success); color: #08210f; }
  .btn-archive { background: transparent; border: 1px solid var(--border); color: var(--muted); }
  .btn-archive:hover { color: var(--danger); border-color: var(--danger); }
  .row { display: flex; gap: 8px; }
  .row input { margin-bottom: 0; }
  .error { color: var(--danger); font-size: 13px; margin: -6px 0 14px; min-height: 1em; }
  .toggle { text-align: center; margin-top: 4px; }
  .habit {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
  }
  .habit:last-child { border-bottom: none; }
  .habit-title { font-size: 15px; font-weight: 600; }
  .habit-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .streak { color: var(--accent); font-weight: 700; }
  .actions { display: flex; gap: 6px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .empty { color: var(--muted); font-size: 14px; text-align: center; padding: 24px 0; }
  #login-view, #app-view, #detail-view { display: none; }
  .habit-title { cursor: pointer; }
  .habit-title:hover { color: var(--accent); }
  .stat-row { display: flex; justify-content: space-between; margin-bottom: 12px; }
  .stat-row:last-child { margin-bottom: 0; }
  .stat-label { color: var(--muted); font-size: 13px; }
  .stat-value { font-weight: 700; font-size: 13px; }
  .calendar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .calendar-nav-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 12px;
    font-size: 15px;
  }
  .calendar-nav-btn:hover { border-color: var(--accent); }
  .calendar-month-label { font-weight: 700; font-size: 15px; }
  .calendar-weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    font-size: 11px;
    color: var(--muted);
    text-align: center;
    margin-bottom: 6px;
  }
  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }
  .calendar-day {
    aspect-ratio: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    background: #0f1115;
    border: 1px solid var(--border);
    font-size: 12px;
  }
  .calendar-day.empty { background: transparent; border: none; }
  .calendar-day.filled { background: var(--success); border-color: var(--success); color: #08210f; font-weight: 700; }
  .calendar-day.today { border-color: var(--accent); }
  .calendar-day .amount { font-size: 9px; margin-top: 1px; }
  .library-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    max-height: 320px;
    overflow-y: auto;
    padding-right: 4px;
  }
  .library-item {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #0f1115;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 13px;
    font-weight: 400;
    color: var(--text);
    text-align: left;
    width: 100%;
  }
  .library-item:hover { border-color: var(--accent); }
  .library-item .emoji { font-size: 16px; }
  .library-item.added { opacity: 0.45; }
  .emoji-picker-panel {
    position: absolute;
    top: 44px;
    left: 0;
    z-index: 10;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
    width: 252px;
    max-height: 180px;
    overflow-y: auto;
  }
  .emoji-picker-panel button {
    background: transparent;
    padding: 6px;
    font-size: 17px;
    border-radius: 6px;
    line-height: 1;
  }
  .emoji-picker-panel button:hover { background: var(--border); }
</style>
</head>
<body>
<div class="wrap">

  <div id="login-view">
    <h1>Habit Tracker</h1>
    <div class="card">
      <form id="login-form">
        <label>E-posta</label>
        <input type="email" id="login-email" required autocomplete="username">
        <label>Şifre</label>
        <input type="password" id="login-password" required autocomplete="current-password">
        <div class="error" id="login-error"></div>
        <button type="submit" class="btn-primary">Giriş yap</button>
      </form>
      <div class="toggle">
        <button class="btn-ghost" id="show-register">Hesabın yok mu? Kayıt ol</button>
      </div>
    </div>

    <div class="card" id="register-card" style="display:none">
      <form id="register-form">
        <label>E-posta</label>
        <input type="email" id="register-email" required autocomplete="username">
        <label>Şifre (en az 8 karakter)</label>
        <input type="password" id="register-password" required minlength="8" autocomplete="new-password">
        <div class="error" id="register-error"></div>
        <button type="submit" class="btn-primary">Kayıt ol ve giriş yap</button>
      </form>
    </div>
  </div>

  <div id="app-view">
    <div class="topbar">
      <h1>Habit'lerim</h1>
      <button class="btn-ghost" id="logout-btn">Çıkış yap</button>
    </div>

    <div class="card">
      <form id="add-habit-form" class="row" style="position: relative;">
        <button type="button" class="btn-archive btn-small" id="emoji-picker-btn" style="flex:none;">🙂</button>
        <input type="text" id="new-habit-title" placeholder="Yeni habit (örn. Kitap oku)" required>
        <button type="submit" class="btn-primary" style="width:auto; white-space:nowrap;">Ekle</button>
        <div class="emoji-picker-panel" id="emoji-picker-panel" style="display:none;"></div>
      </form>
      <div class="toggle">
        <button type="button" class="btn-ghost" id="toggle-library-btn">📚 Habit kütüphanesinden hızlı ekle</button>
      </div>
    </div>

    <div class="card" id="library-card" style="display:none">
      <div class="library-grid" id="library-grid"></div>
      <div class="error" id="library-message" style="color: var(--muted); margin-top: 10px;"></div>
    </div>

    <div class="card">
      <div id="habit-list"></div>
      <div class="empty" id="empty-state" style="display:none">Henüz habit yok. Yukarıdan ekle.</div>
    </div>
  </div>

  <div id="detail-view">
    <div class="topbar">
      <button class="btn-ghost" id="detail-back-btn">← Geri</button>
      <button class="btn-check btn-small" id="detail-check-btn">✓ Bugün</button>
    </div>
    <h1 id="detail-title"></h1>

    <div class="card">
      <div class="stat-row"><span class="stat-label">Güncel seri</span><span class="stat-value" id="detail-current-streak"></span></div>
      <div class="stat-row"><span class="stat-label">En uzun seri</span><span class="stat-value" id="detail-longest-streak"></span></div>
      <div class="stat-row"><span class="stat-label">Toplam check-in</span><span class="stat-value" id="detail-total"></span></div>
      <div class="stat-row"><span class="stat-label">Tamamlanma oranı</span><span class="stat-value" id="detail-rate"></span></div>
      <div class="stat-row" id="detail-amount-row" style="display:none">
        <span class="stat-label" id="detail-amount-label"></span>
        <span class="stat-value" id="detail-amount-value"></span>
      </div>
    </div>

    <div class="card">
      <div class="calendar-header">
        <button type="button" class="calendar-nav-btn" id="calendar-prev-btn">‹</button>
        <span class="calendar-month-label" id="calendar-month-label"></span>
        <button type="button" class="calendar-nav-btn" id="calendar-next-btn">›</button>
      </div>
      <div class="calendar-weekdays">
        <div>Pzt</div><div>Sal</div><div>Çrş</div><div>Prş</div><div>Cum</div><div>Cmt</div><div>Paz</div>
      </div>
      <div class="calendar-grid" id="calendar-grid"></div>
    </div>
  </div>

</div>

<script>
const API = "";

const HABIT_LIBRARY = [
  { emoji: "📚", name: "Kitap oku", unit: "sayfa" },
  { emoji: "🏃", name: "Koşuya çık", unit: "km" },
  { emoji: "💧", name: "Su iç", unit: "litre" },
  { emoji: "🧘", name: "Meditasyon yap", unit: "dakika" },
  { emoji: "🛌", name: "Erken yat", unit: null },
  { emoji: "⏰", name: "Erken kalk", unit: null },
  { emoji: "🏋️", name: "Spor yap", unit: "dakika" },
  { emoji: "🚶", name: "Yürüyüş yap", unit: "dakika" },
  { emoji: "🥗", name: "Sağlıklı beslen", unit: null },
  { emoji: "🚭", name: "Sigara içme", unit: null },
  { emoji: "💊", name: "Vitamin al", unit: null },
  { emoji: "🧴", name: "Cilt bakımı yap", unit: null },
  { emoji: "🦷", name: "Diş fırçala", unit: null },
  { emoji: "📝", name: "Günlük tut", unit: null },
  { emoji: "🎯", name: "Hedeflerini gözden geçir", unit: null },
  { emoji: "💰", name: "Para biriktir", unit: "TL" },
  { emoji: "📖", name: "Ders çalış", unit: "dakika" },
  { emoji: "🗣️", name: "Dil pratiği yap", unit: "dakika" },
  { emoji: "🎸", name: "Enstrüman çal", unit: "dakika" },
  { emoji: "🎨", name: "Resim/çizim yap", unit: null },
  { emoji: "🧹", name: "Ev temizliği yap", unit: null },
  { emoji: "🌱", name: "Bitkileri sula", unit: null },
  { emoji: "📵", name: "Telefon süresini azalt", unit: null },
  { emoji: "☕", name: "Kafeini azalt", unit: null },
  { emoji: "🍎", name: "Meyve/sebze ye", unit: "porsiyon" },
  { emoji: "🚴", name: "Bisiklete bin", unit: "km" },
  { emoji: "🏊", name: "Yüzme yap", unit: "dakika" },
  { emoji: "🙏", name: "Şükran günlüğü yaz", unit: null },
  { emoji: "👨‍👩‍👧", name: "Aileyle vakit geçir", unit: "dakika" },
  { emoji: "🧠", name: "Zihin egzersizi yap", unit: null },
];

let currentHabits = [];

const EMOJI_PICKER_LIST = [
  "📚", "🏃", "💧", "🧘", "🛌", "⏰", "🏋️", "🚶", "🥗", "🚭",
  "💊", "🧴", "🦷", "📝", "🎯", "💰", "📖", "🗣️", "🎸", "🎨",
  "🧹", "🌱", "📵", "☕", "🍎", "🚴", "🏊", "🙏", "🧠", "✍️",
  "🎮", "🎵", "🚗", "🐕", "🌿", "☀️", "🌙", "🔥", "⭐", "✅",
  "📅", "🚿", "🍳", "🧺", "💡", "🧘‍♂️", "🏆", "❤️",
];

function getTokens() {
  return {
    access: localStorage.getItem("access_token"),
    refresh: localStorage.getItem("refresh_token"),
  };
}
function setTokens(access, refresh) {
  localStorage.setItem("access_token", access);
  localStorage.setItem("refresh_token", refresh);
}
function clearTokens() {
  localStorage.removeItem("access_token");
  localStorage.removeItem("refresh_token");
}

async function apiFetch(path, options = {}) {
  const { access } = getTokens();
  options.headers = Object.assign({}, options.headers, {
    Authorization: `Bearer ${access}`,
  });
  let response = await fetch(API + path, options);
  if (response.status === 401) {
    const refreshed = await tryRefresh();
    if (refreshed) {
      const { access: newAccess } = getTokens();
      options.headers.Authorization = `Bearer ${newAccess}`;
      response = await fetch(API + path, options);
    } else {
      showLogin();
      throw new Error("Oturum süresi doldu");
    }
  }
  return response;
}

async function tryRefresh() {
  const { refresh } = getTokens();
  if (!refresh) return false;
  const response = await fetch(API + "/auth/refresh", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ refresh_token: refresh }),
  });
  if (!response.ok) {
    clearTokens();
    return false;
  }
  const data = await response.json();
  setTokens(data.access_token, data.refresh_token);
  return true;
}

function showLogin() {
  clearTokens();
  document.getElementById("app-view").style.display = "none";
  document.getElementById("login-view").style.display = "block";
}

function showApp() {
  document.getElementById("login-view").style.display = "none";
  document.getElementById("detail-view").style.display = "none";
  document.getElementById("app-view").style.display = "block";
  loadHabits();
}

document.getElementById("show-register").addEventListener("click", () => {
  const card = document.getElementById("register-card");
  card.style.display = card.style.display === "none" ? "block" : "none";
});

document.getElementById("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = document.getElementById("login-email").value;
  const password = document.getElementById("login-password").value;
  const errorEl = document.getElementById("login-error");
  errorEl.textContent = "";

  const body = new URLSearchParams();
  body.set("username", email);
  body.set("password", password);

  const response = await fetch(API + "/auth/login", { method: "POST", body });
  if (!response.ok) {
    errorEl.textContent = "E-posta veya şifre hatalı.";
    return;
  }
  const data = await response.json();
  setTokens(data.access_token, data.refresh_token);
  showApp();
});

document.getElementById("register-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = document.getElementById("register-email").value;
  const password = document.getElementById("register-password").value;
  const errorEl = document.getElementById("register-error");
  errorEl.textContent = "";

  const response = await fetch(API + "/auth/register", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email, password }),
  });
  if (!response.ok) {
    const data = await response.json().catch(() => ({}));
    errorEl.textContent = data.detail || "Kayıt başarısız oldu.";
    return;
  }

  const loginBody = new URLSearchParams();
  loginBody.set("username", email);
  loginBody.set("password", password);
  const loginResponse = await fetch(API + "/auth/login", { method: "POST", body: loginBody });
  const loginData = await loginResponse.json();
  setTokens(loginData.access_token, loginData.refresh_token);
  showApp();
});

document.getElementById("logout-btn").addEventListener("click", async () => {
  const { refresh } = getTokens();
  if (refresh) {
    await fetch(API + "/auth/logout", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ refresh_token: refresh }),
    }).catch(() => {});
  }
  showLogin();
});

document.getElementById("add-habit-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const input = document.getElementById("new-habit-title");
  const title = input.value.trim();
  if (!title) return;
  await apiFetch("/habits", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ title }),
  });
  input.value = "";
  loadHabits();
});

document.getElementById("toggle-library-btn").addEventListener("click", () => {
  const card = document.getElementById("library-card");
  const opening = card.style.display === "none";
  card.style.display = opening ? "block" : "none";
  if (opening) renderLibrary();
});

const emojiPickerBtn = document.getElementById("emoji-picker-btn");
const emojiPickerPanel = document.getElementById("emoji-picker-panel");

function renderEmojiPicker() {
  emojiPickerPanel.innerHTML = "";
  for (const emoji of EMOJI_PICKER_LIST) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.textContent = emoji;
    btn.addEventListener("click", () => {
      insertAtCursor(document.getElementById("new-habit-title"), emoji);
      emojiPickerPanel.style.display = "none";
    });
    emojiPickerPanel.appendChild(btn);
  }
}

emojiPickerBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  const opening = emojiPickerPanel.style.display === "none";
  if (opening) renderEmojiPicker();
  emojiPickerPanel.style.display = opening ? "grid" : "none";
});

document.addEventListener("click", (e) => {
  if (emojiPickerPanel.style.display !== "none" &&
      !emojiPickerPanel.contains(e.target) &&
      e.target !== emojiPickerBtn) {
    emojiPickerPanel.style.display = "none";
  }
});

function insertAtCursor(input, text) {
  const start = input.selectionStart ?? input.value.length;
  const end = input.selectionEnd ?? input.value.length;
  input.value = input.value.slice(0, start) + text + input.value.slice(end);
  const newPos = start + text.length;
  input.focus();
  input.setSelectionRange(newPos, newPos);
}

function renderLibrary() {
  const grid = document.getElementById("library-grid");
  const message = document.getElementById("library-message");
  message.textContent = "";
  grid.innerHTML = "";

  const existingTitles = new Set(currentHabits.map((h) => h.title));

  for (const item of HABIT_LIBRARY) {
    const fullTitle = `${item.emoji} ${item.name}`;
    const already = existingTitles.has(fullTitle);

    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "library-item" + (already ? " added" : "");
    const unitBadge = item.unit ? ` <span style="color:var(--muted); font-size:11px;">(${escapeHtml(item.unit)})</span>` : "";
    btn.innerHTML = `<span class="emoji">${item.emoji}</span><span>${escapeHtml(item.name)}${unitBadge}</span>`;
    if (already) {
      btn.disabled = true;
      btn.title = "Zaten listende";
    } else {
      btn.addEventListener("click", () => quickAddFromLibrary(fullTitle, item.unit));
    }
    grid.appendChild(btn);
  }
}

async function quickAddFromLibrary(fullTitle, unit) {
  const message = document.getElementById("library-message");
  await apiFetch("/habits", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ title: fullTitle, tracking_unit: unit || null }),
  });
  message.textContent = `"${fullTitle}" eklendi.`;
  await loadHabits();
  renderLibrary();
}

async function loadHabits() {
  const response = await apiFetch("/habits?limit=100");
  const habits = await response.json();
  currentHabits = habits;
  const list = document.getElementById("habit-list");
  const empty = document.getElementById("empty-state");
  list.innerHTML = "";

  if (habits.length === 0) {
    empty.style.display = "block";
    return;
  }
  empty.style.display = "none";

  for (const habit of habits) {
    const streakResponse = await apiFetch(`/habits/${habit.id}/streak`);
    const streak = await streakResponse.json();

    const row = document.createElement("div");
    row.className = "habit";
    row.innerHTML = `
      <div>
        <div class="habit-title">${escapeHtml(habit.title)}</div>
        <div class="habit-meta">${habit.frequency === "weekly" ? "Haftalık" : "Günlük"} · <span class="streak">${streak.current_streak} 🔥</span></div>
      </div>
      <div class="actions">
        <button class="btn-check btn-small">✓ Bugün</button>
        <button class="btn-archive btn-small">Arşivle</button>
      </div>
    `;
    row.querySelector(".habit-title").addEventListener("click", () => openDetail(habit.id));
    row.querySelector(".btn-check").addEventListener("click", () => checkInHabit(habit));
    row.querySelector(".btn-archive").addEventListener("click", async () => {
      await apiFetch(`/habits/${habit.id}`, { method: "DELETE" });
      loadHabits();
    });
    list.appendChild(row);
  }
}

async function checkInHabit(habit) {
  let amount = null;
  if (habit.tracking_unit) {
    const input = prompt(`${habit.title}\nKaç ${habit.tracking_unit}?`, "");
    if (input === null) return; // cancelled
    const parsed = parseFloat(input.replace(",", "."));
    if (!isNaN(parsed)) amount = parsed;
  }
  await apiFetch(`/habits/${habit.id}/logs`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ amount }),
  });
  const detailVisible = document.getElementById("detail-view").style.display !== "none";
  if (detailVisible && currentDetailId === habit.id) {
    openDetail(habit.id);
  } else {
    loadHabits();
  }
}

let currentDetailId = null;
let currentDetailHabit = null;
let currentDetailLogs = [];
let calendarMonth = new Date();

document.getElementById("detail-back-btn").addEventListener("click", showApp);
document.getElementById("detail-check-btn").addEventListener("click", () => {
  if (currentDetailHabit) checkInHabit(currentDetailHabit);
});
document.getElementById("calendar-prev-btn").addEventListener("click", () => {
  calendarMonth.setMonth(calendarMonth.getMonth() - 1);
  renderCalendar();
});
document.getElementById("calendar-next-btn").addEventListener("click", () => {
  calendarMonth.setMonth(calendarMonth.getMonth() + 1);
  renderCalendar();
});

async function openDetail(habitId) {
  currentDetailId = habitId;
  calendarMonth = new Date();
  calendarMonth.setDate(1);
  document.getElementById("app-view").style.display = "none";
  document.getElementById("detail-view").style.display = "block";

  const [habitRes, statsRes, logsRes] = await Promise.all([
    apiFetch(`/habits/${habitId}`),
    apiFetch(`/habits/${habitId}/stats`),
    apiFetch(`/habits/${habitId}/logs`),
  ]);
  const habit = await habitRes.json();
  const stats = await statsRes.json();
  currentDetailHabit = habit;
  currentDetailLogs = await logsRes.json();

  document.getElementById("detail-title").textContent = habit.title;
  document.getElementById("detail-current-streak").textContent = `${stats.current_streak} 🔥`;
  document.getElementById("detail-longest-streak").textContent = `${stats.longest_streak} 🏆`;
  document.getElementById("detail-total").textContent = stats.total_completions;
  document.getElementById("detail-rate").textContent = `%${stats.completion_rate}`;

  const amountRow = document.getElementById("detail-amount-row");
  if (habit.tracking_unit && stats.total_amount !== null && stats.total_amount !== undefined) {
    amountRow.style.display = "flex";
    document.getElementById("detail-amount-label").textContent = `Toplam ${habit.tracking_unit}`;
    document.getElementById("detail-amount-value").textContent = formatNumber(stats.total_amount);
  } else {
    amountRow.style.display = "none";
  }

  renderCalendar();
}

function renderCalendar() {
  const monthNames = [
    "Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran",
    "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık",
  ];
  const year = calendarMonth.getFullYear();
  const month = calendarMonth.getMonth();

  document.getElementById("calendar-month-label").textContent = `${monthNames[month]}, ${year}`;

  const logsByDate = new Map();
  for (const log of currentDetailLogs) {
    logsByDate.set(log.completed_on, log.amount);
  }

  const today = new Date();
  const todayIso = toIsoDate(today);

  const firstOfMonth = new Date(year, month, 1);
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  // JS getDay(): 0=Sun..6=Sat. Convert to a Monday-first offset (0=Mon..6=Sun).
  const leadingBlanks = (firstOfMonth.getDay() + 6) % 7;

  const grid = document.getElementById("calendar-grid");
  grid.innerHTML = "";

  for (let i = 0; i < leadingBlanks; i++) {
    const blank = document.createElement("div");
    blank.className = "calendar-day empty";
    grid.appendChild(blank);
  }

  for (let day = 1; day <= daysInMonth; day++) {
    const date = new Date(year, month, day);
    const iso = toIsoDate(date);
    const cell = document.createElement("div");
    cell.className = "calendar-day";
    if (iso === todayIso) cell.classList.add("today");

    let inner = `<span>${day}</span>`;
    if (logsByDate.has(iso)) {
      cell.classList.add("filled");
      const amount = logsByDate.get(iso);
      if (amount !== null && amount !== undefined) {
        inner += `<span class="amount">${formatNumber(amount)}</span>`;
      }
    }
    cell.innerHTML = inner;
    grid.appendChild(cell);
  }
}

function formatNumber(n) {
  return Number.isInteger(n) ? String(n) : n.toFixed(1).replace(/\.0$/, "");
}

function toIsoDate(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, "0");
  const d = String(date.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

(async function init() {
  const { access } = getTokens();
  if (!access) {
    showLogin();
    return;
  }
  const response = await fetch(API + "/me", { headers: { Authorization: `Bearer ${access}` } });
  if (response.ok) {
    showApp();
  } else {
    const refreshed = await tryRefresh();
    if (refreshed) showApp();
    else showLogin();
  }
})();
</script>
