name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check migrations are up to date with models
        run: |
          alembic upgrade head
          alembic check

      - name: Run tests
        run: pytest -q

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t habit-tracker-api .

      - name: Smoke test container
        run: |
          docker run -d --name habit-api -p 8000:8000 habit-tracker-api
          timeout 30 sh -c 'until curl -sf http://localhost:8000/health; do sleep 1; done'
          docker logs habit-api
          docker stop habit-api

  postgres-e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Start stack (API + real Postgres) via docker compose
        run: docker compose up --build -d

      - name: Wait for API (runs migrations against Postgres on boot)
        run: timeout 60 sh -c 'until curl -sf http://localhost:8000/health; do sleep 2; done'

      - name: Exercise the API against Postgres
        run: |
          curl -sf -X POST http://localhost:8000/auth/register \
            -H "Content-Type: application/json" \
            -d '{"email":"ci@example.com","password":"testpassword123"}'

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
